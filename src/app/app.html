<app-navbar
  [connectionLabel]="facade.connectionState().label"
  [connectionTone]="facade.connectionState().tone"
  [vehicleCount]="facade.filteredVehicles().length"
  [refreshIntervalMs]="facade.refreshIntervalMs()"
  [darkTheme]="darkTheme()"
  (refreshIntervalChange)="updateRefreshInterval($event)"
  (themeToggle)="toggleTheme()"
/>

<main class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <app-search-bar
        [query]="facade.searchQuery()"
        (queryChange)="updateSearch($event)"
      />
    </div>

    <app-loading-state
      [active]="facade.loading() && facade.vehicles().length === 0"
      [label]="dictionary.labels.loadingGbfs"
    />

    <app-vehicle-list
      [vehicles]="facade.filteredVehicles()"
      [selectedVehicleId]="facade.selectedVehicleId()"
      (vehicleSelected)="selectVehicleFromList($event)"
    />
  </aside>

  <section class="map-panel">
    <app-map-container
      [geoJsonData]="facade.geoJsonData()"
      [selectedVehicle]="facade.selectedVehicle()"
      [darkTheme]="darkTheme()"
      (vehicleSelected)="selectVehicleFromMap($event)"
    />
  </section>
</main>

<footer class="app-footer">
  <div class="footer-left">
    <span>{{ dictionary.labels.footerCopyright }} {{ apiConfig.providerName }} {{ dictionary.labels.footerTracker }}</span>
    <span class="footer-divider"></span>
    <span>{{ dictionary.labels.lastUpdate }} {{ facade.connectionState().lastUpdate }}</span>
  </div>

  <div class="footer-right">
    <span>Datos en tiempo real</span>
    <span class="footer-divider"></span>
    <a
      class="footer-link"
      [href]="feedUrl"
      target="_blank"
      rel="noreferrer"
    >
      Fuente GBFS
    </a>
  </div>
</footer>
